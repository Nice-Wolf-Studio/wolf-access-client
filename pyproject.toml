[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-access-client"
version = "0.2.0"
description = "Python client library for wolf-access, the Nice-Wolf-Studio authorization service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Source = "https://github.com/Nice-Wolf-Studio/wolf-access-client"

[tool.setuptools]
packages = ["wolf_access_client"]
package-data = {wolf_access_client = ["py.typed"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
