# Copied from gateway-client's ci.yml (pytest on Python 3.10 and 3.12), plus
# a full-history secret scan and, on a release tag, a credential-free install
# of that tag (wolf-access spec BND-12 / CLI-D1).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q -rs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog over the full git history
        run: >-
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.97.9
          git file:///repo --no-update --fail --results=verified,unknown

  install-from-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean venv, no credentials, install the tag
        run: |
          python -m venv "$RUNNER_TEMP/v"
          env -i PATH="/usr/bin:/bin" HOME="$(mktemp -d)" GIT_CONFIG_NOSYSTEM=1 \
            "$RUNNER_TEMP/v/bin/pip" install --no-cache-dir \
            "git+https://github.com/${{ github.repository }}@${{ github.ref_name }}"
          "$RUNNER_TEMP/v/bin/python" -c "import wolf_access_client as w; assert 'v' + w.__version__ == '${{ github.ref_name }}', w.__version__; print('installed', w.__version__)"
